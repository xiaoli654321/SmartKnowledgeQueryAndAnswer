apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: skqa
  labels: { app: gateway }
spec:
  replicas: 2
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        # SkyWalking 探针：用 initContainer 把 agent 拷进共享卷，业务镜像不用改
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: gateway
          image: skqa/gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              valueFrom: { configMapKeyRef: { name: skqa-config, key: NACOS_SERVER } }
            - name: TZ
              valueFrom: { configMapKeyRef: { name: skqa-config, key: TZ } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: skqa-secret, key: JWT_SECRET } }
          envFrom:
            - secretRef: { name: skqa-secret }
          resources:
            requests: { cpu: "200m", memory: "384Mi" }
            limits:   { cpu: "1",    memory: "768Mi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: skqa
spec:
  selector: { app: gateway }
  ports:
    - port: 8080
      targetPort: 8080