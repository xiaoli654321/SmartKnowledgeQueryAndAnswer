apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: skqa
  labels: { app: ai-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: ai-service }
  template:
    metadata:
      labels: { app: ai-service }
    spec:
      containers:
        - name: ai-service
          image: skqa/ai-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
              valueFrom: { configMapKeyRef: { name: skqa-config, key: NACOS_SERVER } }
            - name: SPRING_DATA_REDIS_HOST
              valueFrom: { configMapKeyRef: { name: skqa-config, key: REDIS_HOST } }
            - name: SPRING_DATA_REDIS_PORT
              valueFrom: { configMapKeyRef: { name: skqa-config, key: REDIS_PORT } }
            - name: METRIC_SERVICE_BASE_URL
              valueFrom: { configMapKeyRef: { name: skqa-config, key: METRIC_BASE_URL } }
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: skqa-secret, key: LLM_API_KEY } }
            - name: TZ
              valueFrom: { configMapKeyRef: { name: skqa-config, key: TZ } }
          resources:
            requests: { cpu: "300m", memory: "512Mi" }
            limits:   { cpu: "2",    memory: "1Gi" }
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: skqa
spec:
  selector: { app: ai-service }
  ports:
    - port: 8081
      targetPort: 8081