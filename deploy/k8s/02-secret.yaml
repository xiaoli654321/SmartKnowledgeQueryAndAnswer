# 敏感配置
# 生成方式：echo -n 'sk-xxxx' | base64
# 不要把这个文件提交到公开仓库；CI 里用 kubectl create secret 注入
apiVersion: v1
kind: Secret
metadata:
  name: skqa-secret
  namespace: skqa
type: Opaque
stringData:
  LLM_API_KEY: "REPLACE_ME"
  EMBEDDING_API_KEY: "REPLACE_ME"
  # 网关签发/校验 JWT 的密钥：至少 32 字节，否则启动会抛 WeakKeyException
  JWT_SECRET: "REPLACE_ME_WITH_32_BYTES_OR_MORE_SECRET"