name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build-java:
    name: Java 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # 单测里不要连真实中间件：CI 只跑编译 + 纯单测
      - name: mvn verify
        run: mvn -B -ntp -DskipTests=false verify
        env:
          # 测试环境不需要真实 key，避免把密钥写进 CI
          LLM_API_KEY: "ci-placeholder"

  build-python:
    name: metric-service 语法检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r metric-service/requirements.txt
      - name: 编译检查
        run: python -m compileall -q metric-service/app

  docker-images:
    name: 构建 5 个镜像（不推送）
    runs-on: ubuntu-latest
    needs: [build-java]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: 打包 jar
        run: mvn -B -ntp -DskipTests package

      - name: 构建镜像
        run: |
          set -e
          for svc in gateway doc-service search-service ai-service; do
            jar=$(ls $svc/target/$svc-*.jar | grep -v original | head -1)
            docker build -f deploy/docker/Dockerfile.java \
              -t skqa/$svc:ci --build-arg JAR_FILE=$jar .
          done
          docker build -f deploy/docker/Dockerfile.metric -t skqa/metric-service:ci .
          docker build -f deploy/docker/Dockerfile.web -t skqa/web:ci .

      - name: 校验 k8s 清单（客户端 dry-run）
        run: |
          curl -sSLo kubectl https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl
          chmod +x kubectl
          ./kubectl apply --dry-run=client -f deploy/k8s/ --validate=false