server:
  port: 8082          # 讲义口径：doc-service = 8082（8083 留给 search-service）

spring:
  application:
    name: doc-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        ip: 127.0.0.1            # ★ Windows 多网卡：不指定会注册成 172.x 虚拟网卡地址，Feign 打不通
  datasource:
    # ★ host:port 不能省。原来写 jdbc:mysql://doc_db 缺了 127.0.0.1:3306，启动直接连不上库
    # ★ allowPublicKeyRetrieval=true 是 MySQL 8 的 caching_sha2_password 认证要的，不加报 Public Key Retrieval is not allowed
    url: jdbc:mysql://127.0.0.1:3306/doc_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # broker 不可用时 send() 会阻塞这么久再抛异常；默认 60s 会把上传接口一起拖死
        max.block.ms: 5000
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true   # 库里是 tenant_id，实体里是 tenantId，靠它自动映射

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # 不写这行 /actuator/prometheus 直接 404
  metrics:
    tags:
      application: ${spring.application.name}
