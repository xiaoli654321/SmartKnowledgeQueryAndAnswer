server:
  port: 8080          # 网关端口：讲义规定的统一入口，前端/调用方只认这个端口

spring:
  application:
    name: gateway     # ★ 必须和 Nacos 里注册的名字一致；下游路由写 lb://doc-service 就是按这个名字找
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848   # Nacos 2.x 的 gRPC 端口是 9848，容器里必须一起映射，否则这里连不上
    gateway:
      routes:
        # 路由三件套：id 唯一、uri 指向哪、predicates 什么时候命中。
        # ★ 这里有意不加 StripPrefix=1：服务内部的 @RequestMapping 前缀就是 /doc /search /ai，
        #   网关原样转发 /doc/upload → doc-service 的 /doc/upload。
        #   好处：curl 8082 直连和 curl 8080 走网关用的是同一个 URL，少一类 404。
        #   （若哪天真要 StripPrefix=1，服务里的 controller 就必须同步去掉前缀，两边必须一起改）
        - id: doc-route
          uri: lb://doc-service         # lb:// = 交给 loadbalancer 按服务名找实例，不是写死 IP
          predicates:
            - Path=/doc/**              # 访问 /doc/** 的请求交给 doc-service
        - id: search-route
          uri: lb://search-service
          predicates:
            - Path=/search/**
        - id: ai-route
          uri: lb://ai-service
          predicates:
            - Path=/ai/**

# 网关也要被监控：不加这段，Prometheus 抓 8080 只会拿到 404
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
